<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're In &mdash; AI Made Simple 40+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    background:#FBF6EC;
    color:#2A2A25;
    font-family:'Source Sans 3', sans-serif;
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .card{
    max-width:520px;
    text-align:center;
    padding:48px 32px;
  }
  h1{font-family:'Fraunces',serif;color:#1F3B3D;font-size:32px;margin-bottom:16px;}
  p{font-size:19px;line-height:1.6;color:#2A2A25;}
  .btn{
    display:inline-block;
    margin-top:24px;
    background:#D98E2B;
    color:#1F3B3D;
    font-weight:700;
    padding:14px 32px;
    border-radius:10px;
    text-decoration:none;
    font-size:19px;
  }
  .email-note{font-size:15px;color:#2E5457;margin-top:20px;}
</style>
</head>
<body>
  <div class="card">
    <h1>You're all set!</h1>
    <p>Thanks for joining AI Made Simple 40+. Click below to access your first lesson right away.</p>
    <a class="btn" href="{{ course_url }}">Go to Your Course</a>
    {% if email %}
    <div class="email-note">A confirmation has been sent to {{ email }}.</div>
    {% endif %}
  </div>
</body>
</html>
